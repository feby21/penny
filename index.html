<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2E8B57">
  <title>Penny</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">
          <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
            <circle cx="16" cy="16" r="15" fill="#2E8B57"/>
            <circle cx="16" cy="16" r="11.5" fill="none" stroke="#9FD9B5" stroke-width="1.5"/>
            <path d="M12 23V9.5h5.2a4.3 4.3 0 0 1 0 8.6H12" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Penny</span>
        </div>
        <button type="button" class="icon-btn bell" data-action="open-notifications" aria-label="Notifications">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15L6 16Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 20.5a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span class="badge" id="bell-badge" hidden>0</span>
        </button>
      </div>
      <div class="demo-date">
        <label for="demo-date-input">Demo date</label>
        <input type="date" id="demo-date-input">
        <button type="button" class="btn btn-small btn-ghost" data-action="date-plus">+1 day</button>
      </div>
    </header>

    <main class="view" id="view">
      <section class="tab" id="tab-home" data-tab="home"></section>
      <section class="tab" id="tab-inventory" data-tab="inventory" hidden></section>
      <section class="tab" id="tab-recipes" data-tab="recipes" hidden></section>
      <section class="tab" id="tab-community" data-tab="community" hidden></section>
      <section class="tab" id="tab-plans" data-tab="plans" hidden></section>
      <section class="tab" id="overlay" hidden></section>
    </main>

    <nav class="bottom-nav" id="nav" aria-label="Main">
      <button type="button" data-action="tab" data-tab="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1v-8.5Z"/></svg>
        <span>Home</span>
      </button>
      <button type="button" data-action="tab" data-tab="inventory">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M5 10h14M8.5 6.5v1.5M8.5 13v2.5"/></svg>
        <span>Inventory</span>
      </button>
      <button type="button" data-action="tab" data-tab="recipes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10a3 3 0 0 1 3 3v12H8a3 3 0 0 1-3-3v-12Z"/><path d="M5 16.5a3 3 0 0 1 3-3h10M9 8h5"/></svg>
        <span>Recipes</span>
      </button>
      <button type="button" data-action="tab" data-tab="community">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="16.5" cy="9.5" r="2.5"/><path d="M16 14a4.5 4.5 0 0 1 4.5 5"/></svg>
        <span>Community</span>
      </button>
      <button type="button" data-action="tab" data-tab="plans">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9.5h16M8.5 3v4M15.5 3v4M8 13.5h3M8 16.5h6"/></svg>
        <span>Meal Plans</span>
      </button>
    </nav>

    <div class="sheet-backdrop" id="sheet-backdrop" data-action="sheet-close"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true"></section>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="onboarding" id="onboarding" hidden></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/recipes.js"></script>
  <script src="js/community.js"></script>
  <script src="js/mealplan.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
